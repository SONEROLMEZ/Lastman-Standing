<title>Places | Lastman Standing</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050807}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:10px;max-width:1800px;margin:0 auto}
.gallery a{display:block;overflow:hidden;background:#101714;line-height:0}
.gallery img{display:block;width:100%;height:auto;transition:transform .35s ease}
.gallery a:hover img{transform:scale(1.015)}
@media(max-width:700px){.gallery{grid-template-columns:1fr;gap:7px;padding:7px}}
</style>
</head>
